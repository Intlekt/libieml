name: Validate

on:
  pull_request:
    branches:
      - master

  workflow_dispatch:

jobs:
  # build:
  #   runs-on: ubuntu-latest

  #   steps:
  #     - uses: actions/checkout@v7
  #       with:
  #         submodules: 'recursive'

  #     - name: Build the Test Docker Image
  #       run: docker build . --file Dockerfile_build_all_run_test --tag test_image

  #     - name: Run the Test Docker Image
  #       run: docker run test_image

  build_python:
    name: Build Binding Python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: 'recursive'
      - name: Build
        run: docker compose up --build --exit-code-from build_python build_python

  build_wasm:
    name: Build Wasm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: 'recursive'
      - name: Build
        run: docker compose up --build --exit-code-from build_wasm build_wasm

  run_tests:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: 'recursive'
      - name: Tests
        run: docker compose up --build --exit-code-from test test
